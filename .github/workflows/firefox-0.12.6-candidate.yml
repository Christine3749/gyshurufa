name: Firefox 0.12.6 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gy-0.12.6-firefox-address-bar

permissions:
  contents: read

jobs:
  build-windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: gy输入法/native
    steps:
      - uses: actions/checkout@v4

      - name: Configure trace and tests
        run: >-
          cmake -S . -B build-ci-firefox-0.12.6 -G "Visual Studio 17 2022" -A x64
          "-DGY_VERSION=0.12.6" -DGY_IME_TRACE=ON -DGY_REGISTRATION_TRACE=OFF
          -DGY_BUILD_HOST_SMOKE=ON

      - name: Build trace candidate and tests
        run: cmake --build build-ci-firefox-0.12.6 --config Release --parallel 2

      - name: Run non-GUI automated tests
        run: >-
          ctest --test-dir build-ci-firefox-0.12.6 -C Release --output-on-failure
          -E "Gy(InputScopeCacheSmoke|TsfActivationSmoke|InstallerSmoke|HostedPinyinEngineSmoke)"

      - name: Ensure Inno Setup exists
        working-directory: ${{ github.workspace }}
        run: choco install innosetup --no-progress -y

      - name: Build immutable ThinkPad trace candidate
        run: >-
          ./Build-GYThinkPadCandidate.ps1 -Version 0.12.6 -EnableTsfTrace

      - name: Write source and artifact hash evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $paths = [ordered]@{
            dll = 'build-thinkpad-0.12.6/bin/Release/GyIme.dll'
            host = 'build-thinkpad-0.12.6/bin/Release/GyImeHost.exe'
            health = 'build-thinkpad-0.12.6/bin/Release/GyImeHealth.exe'
            setup = 'release/GYInputSetup-0.12.6.exe'
            zip = 'release/GYInput-0.12.6.zip'
          }
          $artifacts = [ordered]@{}
          foreach ($entry in $paths.GetEnumerator()) {
            $file = Get-Item -LiteralPath $entry.Value
            $artifacts[$entry.Key] = [ordered]@{
              path = $entry.Value
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
              productVersion = $file.VersionInfo.ProductVersion
            }
          }
          [ordered]@{
            sourceCommit = $env:SOURCE_COMMIT
            sourceBranch = 'codex/gy-0.12.6-firefox-address-bar'
            version = '0.12.6'
            tsfLifecycleTrace = $true
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'release/firefox-0.12.6-hashes.json' -Encoding utf8

      - name: Upload candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: gy-firefox-0.12.6-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            gy输入法/native/release/GYInputSetup-0.12.6.exe
            gy输入法/native/release/GYInputSetup-0.12.6.exe.sha256
            gy输入法/native/release/GYInput-0.12.6.zip
            gy输入法/native/release/firefox-0.12.6-hashes.json
            gy输入法/native/build-thinkpad-0.12.6/bin/Release/GyIme.dll
            gy输入法/native/build-thinkpad-0.12.6/bin/Release/GyImeHost.exe
            gy输入法/native/build-thinkpad-0.12.6/bin/Release/GyImeHealth.exe
