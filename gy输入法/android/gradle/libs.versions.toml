# 版本目录：全工程唯一版本真相。升级任何一项需在本文件留痕并跑全量 CI。
#
# 选型说明（2026-08-05 T0）：
# - Kotlin 1.9.24 + detekt 1.23.7 是静态分析全兼容的验证矩阵（detekt 内嵌编译器 1.9.x），
#   升 Kotlin 2.x 前须先验证 detekt 无漏报/误报。
# - AGP 8.5.x 需 Gradle 8.7+，配套 wrapper 8.9。
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
ktlintPlugin = "12.1.1"
detekt = "1.23.7"
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
