name: GYInputMac
options:
  bundleIdPrefix: wang.shurufa
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/rime/include"
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/rime/lib"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    SWIFT_VERSION: "5.0"
targets:
  GYInput:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GYInput/Sources
      - path: GYInput/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - GYInput.entitlements
          - rime-data
      - path: GYInput/Resources/rime-data
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.shurufa.inputmethod.GYInput
        PRODUCT_NAME: GYInput
        INFOPLIST_FILE: GYInput/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GYInput/Resources/GYInput.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Security: Keychain 存放 GY 账户的 refresh token（GYAccountAuth）。
        OTHER_LDFLAGS: "$(inherited) -framework InputMethodKit -framework Cocoa -framework Carbon -framework Security -lrime"
    scheme:
      testTargets:
        - GYInputTests
  GYInputTests:
    type: bundle.unit-test
    platform: macOS
    # The app stays on macOS 13 (its real deployment target). XCTest itself
    # only ships from macOS 14 on this Xcode toolchain, so the test bundle
    # (never shipped to users) is pinned separately to avoid a link-time
    # deployment-target mismatch warning.
    deploymentTarget: "14.0"
    sources:
      - path: GYInputTests
      - path: GYInput/Sources/GYCandidateGridMath.h
      - path: GYInput/Sources/GYPunctuationPolicy.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.shurufa.inputmethod.GYInputTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
