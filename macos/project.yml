name: GYInputMac
options:
  bundleIdPrefix: wang.shurufa
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/rime/include"
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/rime/lib"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    SWIFT_VERSION: "5.0"
targets:
  GYInput:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GYInput/Sources
      - path: GYInput/Resources/InfoPlist.strings
        buildPhase: resources
      - path: GYInput/Resources/GYInputMenuIcon.tiff
        buildPhase: resources
      - path: GYInput/Resources/GYInputMenuIcon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.shurufa.inputmethod.GYInput
        PRODUCT_NAME: GYInput
        INFOPLIST_FILE: GYInput/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: GYInput/Resources/GYInput.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: "$(inherited) -framework InputMethodKit -framework Cocoa -framework Carbon -lrime"
    postCompileScripts:
      - name: Embed and sign librime
        script: |
          set -euo pipefail
          framework_dir="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          bundled_rime="${framework_dir}/librime.dylib"
          rime_data_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/rime-data"
          mkdir -p "${framework_dir}"
          ditto "${SRCROOT}/Vendor/rime/lib/librime.dylib" "${bundled_rime}"
          ditto "${SRCROOT}/GYInput/Resources/rime-data" "${rime_data_dir}"
          if [[ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "${bundled_rime}"
          else
            /usr/bin/codesign --force --sign - "${bundled_rime}"
          fi
    scheme:
      testTargets: []
