<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="GY输入法">
  <!-- A quiet grey surround gives the GY mark the same self-contained icon
       footprint as the neighbouring input methods, without duplicating the
       “输入法” supplied by the system source name. -->
  <rect x="2" y="2" width="252" height="252" rx="48" fill="#D7DAE2"/>
  <rect x="16" y="16" width="224" height="224" rx="36" fill="#FAFAF8"/>
  <!-- A small menu-bar icon needs a heavier optical weight than a full-size
       app icon.  The round stroke survives the 16/22px system rasterisation
       while retaining the original G and Y counters. -->
  <g transform="translate(2 42) scale(1.58 1.88)" fill="#111318" stroke="#111318" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">
    <path d="M72 26C65 18 54 13 40 13C21 13 8 28 8 50C8 72 21 87 40 87C56 87 68 77 72 63V52H40V66H57C54 72 48 74 40 74C28 74 21 64 21 50C21 36 28 26 40 26C49 26 56 31 60 37L72 26Z"/>
    <path transform="translate(-4 0)" d="M80 15H94L114 50L134 15H148L121 60V87H107V60L80 15Z"/>
  </g>
</svg>
